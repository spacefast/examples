name: Validate examples and publish recipes

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      only:
        description: "Publish only this recipe slug (optional)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - jekyll
          - gatsby
          - zero
          - blog-with-custom-templates
          - nextjs-static
          - nextjs
          - astro-with-wordpress
          - functions-php
          - kitchen-sink
          - migrate-from-cloudflare-pages
          - migrate-from-vercel
          - migrate-from-netlify
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Spacefast CLI
        run: bun add -g spacefast@0.4.1
      - name: Run app tests
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null; then
            bun install --frozen-lockfile || bun install
            bun test
          fi
      - name: Build deployable artifact
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          GATSBY_TELEMETRY_DISABLED: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
        run: |
          artifact="$RUNNER_TEMP/${{ matrix.app }}.tgz"
          case "${{ matrix.app }}" in
            zero|kitchen-sink)
              cd "${{ matrix.app }}"
              sf build --json
              artifact="$PWD/.spacefast/zero/artifact.json"
              ;;
            migrate-from-netlify)
              sf publish migrate-from-netlify --dry-run --allow-unsupported-platform-features --json
              cd migrate-from-netlify
              npm install
              npm run build
              sf build dist --prebuilt --output "$artifact" --json
              ;;
            *)
              sf build "${{ matrix.app }}" --output "$artifact" --json
              ;;
          esac
          test -s "$artifact"

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test scripts/catalog.test.mjs
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy-manifest:
    needs: manifest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy canonical JSON feed
        id: deployment
        uses: actions/deploy-pages@v4

  discover-recipes:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        env:
          ONLY: ${{ inputs.only }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$ONLY" ]; then
            test -d "recipes/$ONLY"
            jq -cn --arg slug "$ONLY" '[ $slug ]' | sed 's/^/slugs=/' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          all_slugs() {
            find recipes -mindepth 1 -maxdepth 1 -type d -print \
              | sed 's#^recipes/##' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))'
          }

          if [ "${{ github.event_name }}" = "pull_request" ] \
            || [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "slugs=$(all_slugs)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A pure rename (R100) moves a file without changing what it serves.
          changed=$(git diff --name-status -M "$BEFORE" "${{ github.sha }}" \
            | awk -F'\t' '$1 != "R100" {print $NF}')
          slugs=$(printf '%s\n' "$changed" | sed -n 's#^recipes/\([^/]*\)/site/.*#\1#p' \
            | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  publish-recipes:
    needs: discover-recipes
    if: needs.discover-recipes.outputs.slugs != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        slug: ${{ fromJson(needs.discover-recipes.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Spacefast CLI
        run: bun add -g spacefast@0.4.1
      - name: Build
        working-directory: recipes/${{ matrix.slug }}
        run: |
          runtime=$(jq -r '.runtime // "static"' meta.json)
          if [ "$runtime" = "zero" ]; then
            cd site
            bun install --frozen-lockfile
            if jq -e '.scripts.build' package.json >/dev/null; then
              bun run build
            fi
            if [ -f dist/sf.jsonc ]; then
              # Framework layout: the build script staged the capsule into
              # dist/ and already ran `sf build dist` (e.g. astro-zero).
              test -f dist/.spacefast/zero/public/index.html
            else
              sf build
              test -f .spacefast/zero/public/index.html
            fi
            if jq -e '.scripts.test' package.json >/dev/null; then
              bun run test
            fi
          elif [ "$runtime" = "functions" ]; then
            cd site
            bun install --frozen-lockfile
            # Sanity build only: `sf publish` runs its own OpenNext build.
            bun run build
          elif [ -f site/package.json ]; then
            cd site
            bun install --frozen-lockfile || bun install
            bun run build
          fi
      - name: Resolve and validate publish directory
        id: dir
        working-directory: recipes/${{ matrix.slug }}
        run: |
          runtime=$(jq -r '.runtime // "static"' meta.json)
          if [ "$runtime" = "zero" ] && [ -f site/dist/sf.jsonc ]; then
            dir=site/dist
          elif [ "$runtime" = "zero" ] || [ "$runtime" = "functions" ]; then
            dir=site
          elif [ -d site/dist ]; then dir=site/dist
          elif [ -d site/build ]; then dir=site/build
          elif [ -d site/out ]; then dir=site/out
          else dir=site
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          if [ "$runtime" = "static" ]; then
            bun ../../scripts/validate-publish-dir.mjs "${{ matrix.slug }}" "$dir"
          fi
      - name: Publish Spacefast space
        if: github.event_name != 'pull_request'
        working-directory: recipes/${{ matrix.slug }}
        env:
          SPACEFAST_TOKEN: ${{ secrets.SPACEFAST_DEPLOY_KEY }}
          SPACEFAST_API_URL: https://api.spacefast.com
        run: |
          space_slug=$(jq -er '.publish_slug // .slug' meta.json)
          runtime=$(jq -r '.runtime // "static"' meta.json)
          publish_args=(
            "${{ steps.dir.outputs.dir }}"
            --team spacefast-examples
            --source-type git
            --git-repository "${{ github.repository }}"
            --git-branch "${{ github.ref_name }}"
            --git-commit "${{ github.sha }}"
            --wait
            --json
          )
          if [ "$runtime" = "zero" ]; then
            # The Build step already ran the framework build and `sf build`.
            publish_args+=(--skip-build)
          fi

          set +e
          result=$(sf publish "${publish_args[@]}" --space "$space_slug" 2>&1)
          exit_code=$?
          set -e
          printf '%s\n' "$result"

          if [ "$exit_code" -eq 0 ]; then
            exit 0
          fi
          if ! jq -e '.error.code == "not_found"' <<<"$result" >/dev/null; then
            exit "$exit_code"
          fi

          sf publish "${publish_args[@]}" --slug "$space_slug"
