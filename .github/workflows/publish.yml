name: Validate examples

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: examples-${{ github.ref }}
  cancel-in-progress: false

jobs:
  examples:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - jekyll
          - gatsby
          - zero
          - blog-with-custom-templates
          - nextjs-static
          - nextjs
          - astro-with-wordpress
          - functions-php
          - kitchen-sink
          - migrate-from-cloudflare-pages
          - migrate-from-vercel
          - migrate-from-netlify
          - wp-zero
          - astro-zero
          - wp-astro
          - wp-react
          - zero-perfect
          - unfurl
          - trailhead
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Spacefast CLI
        run: bun add -g spacefast@0.8.0
      - name: Run app tests
        working-directory: ${{ matrix.app }}
        run: |
          if [ -f package.json ] && jq -e '.scripts.test' package.json >/dev/null; then
            bun install --frozen-lockfile || bun install
            bun test
          fi
      - name: Build deployable artifact
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          GATSBY_TELEMETRY_DISABLED: "1"
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg
        run: |
          artifact="$RUNNER_TEMP/${{ matrix.app }}.tgz"
          case "${{ matrix.app }}" in
            zero|kitchen-sink|zero-perfect)
              cd "${{ matrix.app }}"
              sf build --json
              artifact="$PWD/.spacefast/zero/artifact.json"
              ;;
            astro-zero)
              # Astro builds into dist/, the capsule is staged beside it, and
              # the package build script already runs `sf build dist`.
              cd astro-zero
              bun install --frozen-lockfile
              bun run build
              artifact="$PWD/dist/.spacefast/zero/public/index.html"
              ;;
            migrate-from-netlify)
              sf publish migrate-from-netlify --dry-run --allow-unsupported-platform-features --json
              cd migrate-from-netlify
              npm install
              npm run build
              sf build dist --prebuilt --output "$artifact" --json
              ;;
            *)
              sf build "${{ matrix.app }}" --output "$artifact" --json
              ;;
          esac
          test -s "$artifact"
