<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><sf-page-title></sf-page-title> · The Margins</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f1ede3;
        --ink: #1c1d1a;
        --muted: #686a63;
        --line: #c7c4ba;
        --accent: #e25d33;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }

      .skip-link {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1;
        padding: 10px 12px;
        transform: translateY(-150%);
        background: var(--ink);
        color: var(--bg);
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      header,
      main,
      footer {
        width: min(760px, calc(100% - 40px));
        margin: auto;
      }

      header {
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
      }

      header a {
        color: inherit;
        font: 700 1.1rem Georgia, serif;
        text-decoration: none;
      }

      header span {
        color: var(--muted);
        font-size: 0.75rem;
      }

      main {
        padding: 80px 0 100px;
      }

      sf-content {
        display: block;
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 0 48px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161814;
          --ink: #f2eee3;
          --muted: #a8aaa1;
          --line: #373a34;
          --accent: #ff7b52;
        }
      }

      @media (max-width: 540px) {
        header span {
          display: none;
        }

        footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
      <a href="/" aria-label="Homepage">The Margins</a>
      <span>Independent notes on useful software</span>
    </header>
    <main id="content">
      <sf-content></sf-content>
    </main>
    <footer>
      <span>Written in the margins.</span>
      <sf-spacefast-branding></sf-spacefast-branding>
    </footer>
  </body>
</html>
