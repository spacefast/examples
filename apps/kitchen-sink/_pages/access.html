<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Private note · Field Notes</title>
    <style>
      :root { color-scheme:light dark; --canvas:#f7f4ec; --paper:#fffdf8; --ink:#1e211c; --muted:#6b6d65; --line:rgba(30,33,28,.14); --accent:#b6462d; font-family:ui-sans-serif,system-ui,sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; min-width:320px; min-height:100dvh; display:grid; place-items:center; padding:24px; background:var(--canvas); color:var(--ink); -webkit-font-smoothing:antialiased; }
      main { width:min(100%, 920px); display:grid; grid-template-columns:minmax(0,3fr) minmax(280px,2fr); border-top:1px solid var(--line); }
      .intro { padding:48px 48px 48px 0; }
      .lanes { padding:48px; border-left:1px solid var(--line); background:var(--paper); }
      .eyebrow { margin:0; color:var(--accent); font:600 12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.08em; text-transform:uppercase; }
      h1 { max-width:10ch; margin:18px 0 0; font-family:ui-serif,Georgia,serif; font-size:clamp(3rem,7vw,5.4rem); font-weight:500; line-height:.94; letter-spacing:-.055em; }
      .intro p:last-child { max-width:42ch; margin:26px 0 0; color:var(--muted); font-size:18px; line-height:1.7; }
      sf-access-status, sf-access-lanes, sf-spacefast-branding { display:block; }
      .lanes h2 { margin:0; font-family:ui-serif,Georgia,serif; font-size:26px; font-weight:500; }
      sf-access-status { margin-top:10px; color:var(--muted); line-height:1.6; }
      sf-access-lanes { margin-top:28px; }
      sf-spacefast-branding { margin-top:30px; color:var(--muted); font-size:14px; }
      button, input { min-height:44px; font:inherit; }
      input { width:100%; border:1px solid var(--line); border-radius:9px; background:var(--canvas); color:var(--ink); }
      button { border:1px solid var(--accent); border-radius:9px; padding:8px 14px; background:var(--accent); color:#fffaf4; cursor:pointer; }
      @media(max-width:720px) { main { grid-template-columns:1fr; } .intro { padding:36px 0; } .lanes { padding:30px 0 0; border-top:1px solid var(--line); border-left:0; background:transparent; } h1 { font-size:clamp(3rem,15vw,4.7rem); } }
      @media(prefers-color-scheme:dark) { :root { --canvas:#151713; --paper:#1a1c18; --ink:#f1efe7; --muted:#aaa99f; --line:rgba(255,255,255,.12); --accent:#ef7658; } button { color:#1c0d09; } }
    </style>
  </head>
  <body>
    <main>
      <section class="intro">
        <p class="eyebrow">Field Notes / private draft</p>
        <h1>This note needs an invitation.</h1>
        <p>The editor is still working. Use the access method they shared with you, or request a place on the reading list.</p>
      </section>
      <section class="lanes" aria-label="Access options">
        <h2>Choose an access method</h2>
        <sf-access-status></sf-access-status>
        <sf-access-lanes></sf-access-lanes>
        <sf-spacefast-branding></sf-spacefast-branding>
      </section>
    </main>
  </body>
</html>
