<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><meta name="robots" content="noindex" /><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; form-action 'self'" /><title>Private draft · The Margins</title><style>:root{--bg:#f1ede3;--ink:#1c1d1a;--muted:#686a63;--line:#c7c4ba;--accent:#e25d33;font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink)}main{width:min(900px,100%);display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}.intro,.gate{padding:48px}.gate{border-left:1px solid var(--line);background:#fffaf0}p:first-child{color:var(--accent);font:700 .75rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.1em}h1{margin:20px 0;font:400 clamp(3rem,7vw,5.5rem)/.92 Georgia,serif;letter-spacing:-.06em}.intro p:last-child,sf-access-status{display:block;color:var(--muted);line-height:1.7}sf-access-lanes{display:block;margin-top:26px}sf-spacefast-branding{display:block;margin-top:30px;color:var(--muted);font-size:.8rem}button,input{min-height:44px;font:inherit}@media(max-width:700px){main{grid-template-columns:1fr}.intro,.gate{padding:34px 0}.gate{border-top:1px solid var(--line);border-left:0;background:transparent}}</style></head>
  <body><main><section class="intro"><p>Private draft</p><h1>This note is still in the margins.</h1><p>Use the access method the editor shared with you.</p></section><section class="gate"><h2>Continue reading</h2><sf-access-status></sf-access-status><sf-access-lanes></sf-access-lanes><sf-spacefast-branding></sf-spacefast-branding></section></main></body>
</html>
