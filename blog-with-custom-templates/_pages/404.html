<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · The Margins</title>
    <style>
      :root {
        --bg: #f1ede3;
        --ink: #1c1d1a;
        --muted: #686a63;
        --accent: #e25d33;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(720px, 100%);
      }

      .eyebrow {
        color: var(--accent);
        font: 700 0.75rem ui-monospace, monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 10ch;
        margin: 20px 0;
        font: 400 clamp(3.5rem, 10vw, 7rem) / 0.9 Georgia, serif;
        letter-spacing: -0.06em;
      }

      p {
        max-width: 560px;
        color: var(--muted);
        line-height: 1.7;
      }

      a {
        color: var(--ink);
        text-underline-offset: 0.22em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404 · Outside the margins</p>
      <h1>There is no note here.</h1>
      <p>
        Nothing was published at
        <strong><sf-page-path></sf-page-path></strong>. The note may have moved,
        or the link may have picked up an extra mark.
      </p>
      <p><a href="/">Return to all writing →</a></p>
    </main>
  </body>
</html>
